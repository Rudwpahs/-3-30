<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a9231b">
<title>생활 중국어 기말고사 완전 정복</title>
<style>
:root{--red:#a9231b;--ink:#211a17;--muted:#746861;--line:#e4ddd6;--paper:#fffdf9}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 0,#efe0d4,transparent 30rem),#f8f6f2}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100% - 1120px)/2));background:#fffdf9ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left}.brand b{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--red);color:#fff;font-size:24px}.brand strong,.brand small{display:block}.brand small{font-size:10px;color:var(--muted);margin-top:3px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;border-radius:9px;padding:9px 10px;font-size:12px;font-weight:700;color:#675d57}nav button.on,nav button:hover{background:#f2e4dd;color:var(--red)}main{width:min(1120px,calc(100% - 28px));margin:auto}.hero{min-height:470px;display:grid;grid-template-columns:1.3fr .7fr;align-items:center;gap:60px}.pill,.eyebrow{display:inline-block;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.08em}.pill{padding:7px 11px;border-radius:99px;background:#f2ded7}.hero h1{font-size:clamp(42px,6vw,68px);line-height:1.1;letter-spacing:-.05em;margin:19px 0}.hero h1 em{font-style:normal;color:var(--red)}.hero p,.sub{color:var(--muted);line-height:1.75}.primary{border:0;border-radius:12px;background:var(--red);color:#fff;padding:13px 18px;font-weight:800}.seal{height:270px;border:1px solid var(--line);border-radius:30px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 24px 65px #51361f17}.seal b{font-family:serif;font-size:88px;color:#e8d3ca}.seal strong{font-size:22px;margin-top:-12px}.seal small{color:var(--red);margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:60px}.card,.panel,.tone,.expr,.rule,.sentence,.quizbox{border:1px solid var(--line);background:var(--paper);border-radius:18px}.card{padding:22px;text-align:left;min-height:180px}.card span{font-size:10px;color:var(--red);font-weight:800}.card h2{font-size:19px;margin:12px 0 8px}.card p{font-size:13px;color:var(--muted)}.page{padding:55px 0 75px}.title{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:25px}.title h1{font-size:clamp(34px,5vw,50px);margin:7px 0;letter-spacing:-.04em}.tones,.exprs,.rules{display:grid;gap:12px}.tones{grid-template-columns:repeat(4,1fr)}.tone,.expr,.rule,.panel{padding:20px}.tone strong{font-family:serif;font-size:42px;color:var(--red)}.tone h3,.rule h3{margin:8px 0}.tone p,.rule p{font-size:13px;color:var(--muted)}.panel{margin-top:16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips span{background:#f2ece7;border-radius:8px;padding:8px 11px;font-family:monospace;font-weight:700}.rules{grid-template-columns:repeat(2,1fr);margin-top:16px}.exprs{grid-template-columns:repeat(3,1fr)}.expr{min-height:155px;position:relative;display:flex;flex-direction:column;justify-content:center}.expr strong{font-family:serif;font-size:24px}.expr b{font-size:12px;color:var(--red);margin-top:7px}.expr p{font-size:13px;color:var(--muted);margin-bottom:0}.expr button{position:absolute;right:12px;top:12px;border:0;border-radius:50%;width:34px;height:34px;background:#f2e6e0;color:var(--red)}ol{padding-left:22px}li{margin:10px 0;line-height:1.6}.hanzi{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.hanzi button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 6px}.hanzi strong,.hanzi span,.hanzi small{display:block}.hanzi strong{font-family:serif;font-size:22px}.hanzi span{font-size:10px;color:var(--red);margin:4px}.hanzi small{font-size:10px;color:var(--muted)}.sentences{display:grid;gap:8px}.sentence{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 16px}.sentence>span{font-weight:800;color:#a99b93}.sentence h3{font-size:14px;margin:0}.answer{display:none;margin-top:7px}.answer.show{display:block}.answer strong{display:block;font-family:serif;font-size:18px}.answer b{font-size:11px;color:var(--red)}.sentence button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.quizwrap{max-width:750px;margin:auto}.quizbox{padding:26px}.quizbox h2{margin-top:0}.option{display:flex;justify-content:space-between;width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left}.option.ok{background:#edf6ee;border-color:#9fc1a4;color:#2f6638}.option.no{background:#f9e9e7;border-color:#d6a6a1;color:#8b2a23}.score{text-align:center;padding:90px 0}.score h1{font-size:70px;margin:15px}.hidden{display:none!important}.foot{text-align:center;color:#968981;font-size:11px;padding:30px}
@media(max-width:850px){header{padding-bottom:62px}nav{position:fixed;left:0;right:0;bottom:0;background:#fffdf9f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(8,1fr);padding:7px}nav button{font-size:9px;padding:5px 2px}.hero{grid-template-columns:1fr;gap:20px;padding:45px 0}.seal{height:190px}.grid{grid-template-columns:repeat(2,1fr)}.hanzi{grid-template-columns:repeat(4,1fr)}}
@media(max-width:580px){.hero h1{font-size:40px}.grid,.tones,.exprs,.rules{grid-template-columns:1fr}.hanzi{grid-template-columns:repeat(3,1fr)}.sentence{grid-template-columns:32px 1fr}.sentence button{grid-column:2;justify-self:end}}
</style>
</head>
<body>
<header><button class="brand" onclick="go('home')"><b>中</b><span><strong>생활 중국어</strong><small>기말고사 완전 정복</small></span></button><nav id="nav"></nav></header>
<main id="app"></main><div class="foot">중학교 생활 중국어 1~4과 및 기말 대비 보충자료 기반</div>
<script>
const nav=[['home','홈'],['pron','발음'],['l2','2과'],['l3','3과'],['l4','4과'],['hanzi','한자'],['sent','문장'],['quiz','퀴즈']];
const lessons={l2:{t:'你好！',s:'인사 · 감사 · 사과',e:[['你好','Nǐ hǎo','안녕하세요'],['你们好','Nǐmen hǎo','여러분 안녕하세요'],['您好','Nín hǎo','안녕하세요(존칭)'],['老师好','Lǎoshī hǎo','선생님 안녕하세요'],['大家好','Dàjiā hǎo','여러분 안녕하세요'],['再见','Zàijiàn','잘 가'],['明天见','Míngtiān jiàn','내일 만나'],['谢谢','Xièxie','감사합니다'],['不客气','Bú kèqi','천만에요'],['对不起','Duìbuqǐ','미안합니다'],['没关系','Méi guānxi','괜찮습니다'],['不好意思','Bù hǎoyìsi','미안합니다/실례합니다']],r:['们은 사람을 나타내는 말 뒤에 붙여 복수를 나타냅니다: 你→你们, 我→我们.','제3성+제3성은 앞 음절을 제2성처럼 발음하지만 표기는 그대로 둡니다.','不 뒤에 제4성이 오면 不를 제2성 bú로 발음합니다.']},l3:{t:'你是哪国人？',s:'이름 · 국적 · 인물 묘사',e:[['你叫什么名字？','Nǐ jiào shénme míngzi?','너의 이름은 무엇이니?'],['我叫金东民。','Wǒ jiào Jīn Dōngmín.','내 이름은 김동민이야.'],['你是哪国人？','Nǐ shì nǎ guó rén?','너는 어느 나라 사람이니?'],['我是韩国人。','Wǒ shì Hánguórén.','나는 한국인이야.'],['我不是学生。','Wǒ bú shì xuésheng.','나는 학생이 아니야.'],['他很帅。','Tā hěn shuài.','그는 잘생겼다.'],['她很漂亮。','Tā hěn piàoliang.','그녀는 예쁘다.']],r:['긍정은 주어+是+목적어, 부정은 주어+不是+목적어입니다.','평서문 끝에 吗를 붙이면 예/아니오 의문문이 됩니다.','형용사 술어문에서는 很+형용사를 자주 씁니다.','什么, 哪 같은 의문사는 알고 싶은 자리에 그대로 놓습니다.']},l4:{t:'她是谁？',s:'가족 · 나이 · 학년 · 숫자',e:[['她是谁？','Tā shì shéi?','그녀는 누구니?'],['她是我妹妹。','Tā shì wǒ mèimei.','그녀는 내 여동생이야.'],['你有哥哥吗？','Nǐ yǒu gēge ma?','너는 형/오빠가 있니?'],['有，这是我哥哥。','Yǒu, zhè shì wǒ gēge.','응, 이 사람은 내 형/오빠야.'],['没有。','Méiyǒu.','없어.'],['你姐姐今年多大？','Nǐ jiějie jīnnián duō dà?','너의 언니/누나는 올해 몇 살이니?'],['我姐姐今年二十岁。','Wǒ jiějie jīnnián èrshí suì.','내 언니/누나는 올해 스무 살이야.'],['他上几年级？','Tā shàng jǐ niánjí?','그는 몇 학년이니?'],['高中二年级。','Gāozhōng èr niánjí.','고등학교 2학년이야.']],r:['有의 부정은 不有가 아니라 没有입니다.','또래·어린 사람은 几岁, 일반적으로는 多大, 높임 표현은 多大年纪를 씁니다.','학년은 上几年级？로 묻고 初中三年级처럼 답합니다.','11=十一, 20=二十, 36=三十六처럼 숫자를 조립합니다.']}};
const H='我:wǒ:나|你:nǐ:너|您:nín:당신(존칭)|他:tā:그|她:tā:그녀|好:hǎo:좋다|再见:zàijiàn:잘 가|明天:míngtiān:내일|见:jiàn:만나다|不:bù:아니다|没:méi:없다|叫:jiào:부르다|什么:shénme:무엇|名字:míngzi:이름|是:shì:이다|哪:nǎ:어느|国:guó:나라|人:rén:사람|韩国人:Hánguórén:한국인|中国人:Zhōngguórén:중국인|美国人:Měiguórén:미국인|很:hěn:매우|的:de:~의|朋友:péngyou:친구|吗:ma:입니까|学生:xuésheng:학생|谁:shéi:누구|几:jǐ:몇|岁:suì:살|今年:jīnnián:올해|多:duō:얼마나|大:dà:크다|年纪:niánjì:나이|有:yǒu:있다|没有:méiyǒu:없다|这:zhè:이것|上:shàng:다니다|年级:niánjí:학년'.split('|').map(x=>x.split(':'));
const S=[['你们好！','Nǐmen hǎo!','얘들아 안녕!'],['老师好！','Lǎoshī hǎo!','선생님 안녕하세요!'],['大家好！','Dàjiā hǎo!','여러분 안녕하세요!'],['您好！','Nín hǎo!','어르신 안녕하세요!'],['谢谢！','Xièxie!','감사합니다!'],['对不起！','Duìbuqǐ!','미안합니다!'],['没关系。','Méi guānxi.','괜찮습니다.'],['不客气。','Bú kèqi.','천만에요.'],['再见！','Zàijiàn!','잘 가!'],['明天见！','Míngtiān jiàn!','내일 만나!'],['你是中国人吗？','Nǐ shì Zhōngguórén ma?','당신은 중국인입니까?'],['不，我是韩国人。','Bù, wǒ shì Hánguórén.','아니요, 나는 한국인입니다.'],['我不是日本人。','Wǒ bú shì Rìběnrén.','나는 일본인이 아닙니다.'],['你是哪国人？','Nǐ shì nǎ guó rén?','당신은 어느 나라 사람입니까?'],['你叫什么名字？','Nǐ jiào shénme míngzi?','너의 이름은 무엇이니?'],['他是学生吗？','Tā shì xuésheng ma?','그는 학생이니?'],['他很帅。','Tā hěn shuài.','그는 잘생겼다.'],['她不漂亮。','Tā bù piàoliang.','그녀는 예쁘지 않다.'],['她很可爱。','Tā hěn kě’ài.','그녀는 귀엽다.'],['她是我的朋友。','Tā shì wǒ de péngyou.','그녀는 내 친구다.']];
const Q=[["‘천만에요’는?",['没关系','不客气','对不起','再见'],'不客气'],['有의 부정형은?',['不有','没有','不是','没是'],'没有'],["‘너의 이름은 무엇이니?’는?",['你是哪国人？','你叫什么名字？','她是谁？','你有哥哥吗？'],'你叫什么名字？'],['제3성+제3성의 실제 발음은?',['앞 음절을 제1성','앞 음절을 제2성','뒤 음절을 제2성','둘 다 제4성'],'앞 음절을 제2성'],['36의 중국어 표기는?',['三六','三十六','十三六','六十三'],'三十六'],["‘그녀는 누구니?’는?",['她是谁？','她几岁？','她好吗？','她是哪国人？'],'她是谁？'],["‘나는 한국인이다’는?",['我是韩国人。','我不是韩国人。','我是中国人吗？','你是韩国人。'],'我是韩国人。'],["‘내일 만나!’는?",['再见！','明天见！','你们好！','不客气！'],'明天见！']];
let view='home',qi=0,score=0,locked=false;
const title=(tag,t,s)=>`<div class="title"><span class="eyebrow">${tag}</span><h1>${t}</h1><p class="sub">${s}</p></div>`;
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();scrollTo(0,0)}
function renderNav(){document.getElementById('nav').innerHTML=nav.map(x=>`<button data-v="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function render(){const a=document.getElementById('app');if(view==='home')a.innerHTML=`<section class="hero"><div><span class="pill">업로드 자료 맞춤형</span><h1>시험에 나오는 것만<br><em>빠르게, 정확하게.</em></h1><p>기말 대비 보충자료와 생활 중국어 교과서 2~4과를 기준으로 발음, 회화, 한자와 문장 쓰기를 한 번에 정리했습니다.</p><button class="primary" onclick="go('l2')">2과부터 시작 →</button></div><aside class="seal"><b>期末</b><strong>기말 대비</strong><small>발음 · 2과 · 3과 · 4과</small></aside></section><section class="grid">${[['pron','발음 핵심 규칙','성조, 성모·운모, 표기 규칙'],['l2','2과 인사 표현','你好, 谢谢, 对不起'],['l3','3과 이름과 국적','叫什么名字, 哪国人'],['l4','4과 가족과 나이','有·没有, 几岁, 年级'],['hanzi','필수 한자 38개','시험 쓰기 범위 반복'],['sent','문장 쓰기 20개','수행평가 연습지 기준']].map(x=>`<button class="card" onclick="go('${x[0]}')"><span>STUDY</span><h2>${x[1]}</h2><p>${x[2]}</p></button>`).join('')}</section>`;else if(view==='pron')a.innerHTML=`<section class="page">${title('1과 운모 보충','발음 핵심 규칙','형성평가에 나온 성조·성모·운모와 표기 규칙입니다.')}<div class="tones">${[['제1성','ā','높고 평평하게'],['제2성','á','중간에서 위로'],['제3성','ǎ','낮췄다가 올리기'],['제4성','à','높은 데서 내리기']].map(x=>`<article class="tone"><strong>${x[1]}</strong><h3>${x[0]}</h3><p>${x[2]}</p></article>`).join('')}</div><div class="panel"><h2>성모 21개</h2><div class="chips">${'b p m f d t n l g k h j q x zh ch sh r z c s'.split(' ').map(x=>`<span>${x}</span>`).join('')}</div></div><div class="rules"><article class="rule"><h3>j·q·x 뒤의 ü</h3><p>점 두 개를 생략하여 ju, que, xun처럼 씁니다.</p></article><article class="rule"><h3>성모가 없는 i·u·ü</h3><p>i는 y, u는 w, ü는 yu로 표기합니다.</p></article><article class="rule"><h3>iou·uei·uen</h3><p>성모가 붙으면 가운데 모음을 생략해 liu, dui, kun으로 씁니다.</p></article><article class="rule"><h3>성조 기호 위치</h3><p>a가 우선이며, 없으면 o/e에 붙입니다. iu·ui는 뒤 글자에 붙입니다.</p></article></div></section>`;else if(lessons[view]){const d=lessons[view];a.innerHTML=`<section class="page">${title('단원정리',d.t,d.s)}<div class="exprs">${d.e.map(x=>`<article class="expr"><button onclick="speak('${x[0]}')">▶</button><strong>${x[0]}</strong><b>${x[1]}</b><p>${x[2]}</p></article>`).join('')}</div><div class="panel"><h2>문법 규칙</h2><ol>${d.r.map(x=>`<li>${x}</li>`).join('')}</ol></div></section>`}else if(view==='hanzi')a.innerHTML=`<section class="page">${title('한자 쓰기','필수 한자 카드','보충자료의 필수 한자를 반복해서 확인하세요.')}<div class="hanzi">${H.map(x=>`<button onclick="alert('${x[0]}  ·  ${x[1]}  ·  ${x[2]}')"><strong>${x[0]}</strong><span>${x[1]}</span><small>${x[2]}</small></button>`).join('')}</div></section>`;else if(view==='sent')a.innerHTML=`<section class="page">${title('기말 대비 종작 연습','문장 쓰기 20개','한국어만 보고 먼저 쓴 뒤 정답을 확인하세요.')}<div class="sentences">${S.map((x,i)=>`<article class="sentence"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${x[2]}</h3><div id="ans${i}" class="answer"><strong>${x[0]}</strong><b>${x[1]}</b></div></div><button onclick="document.getElementById('ans${i}').classList.toggle('show')">정답</button></article>`).join('')}</div></section>`;else if(view==='quiz')renderQuiz()}
function renderQuiz(){const a=document.getElementById('app');if(qi>=Q.length){a.innerHTML=`<section class="score"><span class="eyebrow">QUIZ COMPLETE</span><h1>${score*10}점</h1><p>${score>=7?'좋습니다. 시험 준비가 잘 되어 있습니다.':'틀린 단원을 한 번 더 복습해 보세요.'}</p><button class="primary" onclick="qi=0;score=0;locked=false;renderQuiz()">다시 시작</button></section>`;return}const q=Q[qi];a.innerHTML=`<section class="page quizwrap">${title('실전 퀴즈','최종 점검',`${qi+1} / ${Q.length} 문제`)}<div class="quizbox"><h2>${q[0]}</h2><div id="opts">${q[1].map(x=>`<button class="option" onclick="answer(this,'${x.replaceAll("'","\\'")}')">${x}<span></span></button>`).join('')}</div><button id="next" class="primary hidden" onclick="qi++;locked=false;renderQuiz()">다음 →</button></div></section>`}
function answer(btn,val){if(locked)return;locked=true;const right=Q[qi][2];if(val===right){score++;btn.classList.add('ok')}else btn.classList.add('no');[...document.querySelectorAll('.option')].forEach(b=>{if(b.textContent.trim()===right)b.classList.add('ok')});document.getElementById('next').classList.remove('hidden')}
renderNav();go('home');
</script>
</body></html>
