function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();scrollTo(0,0)}
function renderNav(){document.getElementById('nav').innerHTML=nav.map(x=>`<button data-v="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function render(){const a=document.getElementById('app');if(view==='home')a.innerHTML=`<section class="hero"><div><span class="pill">학습지·교과서 맞춤형</span><h1>본문은 본문대로,<br><em>한자는 빠짐없이.</em></h1><p>교과서 2~4과의 본문 1·2를 대화 순서 그대로 정리하고, 학습지의 시험 한자 38개를 단원별로 나눴습니다.</p><button class="primary" onclick="go('l2')">2과 본문 시작 →</button></div><aside class="seal"><b>期末</b><strong>기말 대비</strong><small>본문 · 한자 · 음성 · 퀴즈</small></aside></section><section class="grid">${[['pron','발음 핵심 규칙','성조, 성모·운모, 표기 규칙'],['l2','2과 본문','인사 · 감사 · 사과'],['l3','3과 본문','이름 · 국적 · 인물 묘사'],['l4','4과 본문','가족 · 나이 · 학년'],['hanzi','단원별 한자 38개','뜻 · 한어병음 · 음성'],['sent','문장 쓰기 20개','기말 대비 종작 연습']].map(x=>`<button class="card" onclick="go('${x[0]}')"><span>STUDY</span><h2>${x[1]}</h2><p>${x[2]}</p></button>`).join('')}</section>`;else if(view==='pron')a.innerHTML=`<section class="page">${title('1과 발음 보충','발음 핵심 규칙','학습지 형성평가에 나온 성조·성모·운모와 표기 규칙입니다.')}<div class="tones">${[['제1성','ā','높고 평평하게'],['제2성','á','중간에서 위로'],['제3성','ǎ','낮췄다가 올리기'],['제4성','à','높은 데서 내리기']].map(x=>`<article class="tone"><strong>${x[1]}</strong><h3>${x[0]}</h3><p>${x[2]}</p></article>`).join('')}</div><div class="panel"><h2>성모 21개</h2><div class="chips">${'b p m f d t n l g k h j q x zh ch sh r z c s'.split(' ').map(x=>`<span>${x}</span>`).join('')}</div></div><div class="rules"><article class="rule"><h3>j·q·x 뒤의 ü</h3><p>점 두 개를 생략하여 ju, que, xun처럼 씁니다.</p></article><article class="rule"><h3>성모가 없는 i·u·ü</h3><p>i는 y, u는 w, ü는 yu로 표기합니다.</p></article><article class="rule"><h3>iou·uei·uen</h3><p>성모가 붙으면 가운데 모음을 생략해 liu, dui, kun으로 씁니다.</p></article><article class="rule"><h3>성조 기호 위치</h3><p>a가 우선이며, 없으면 o/e에 붙입니다. iu·ui는 뒤 글자에 붙입니다.</p></article></div></section>`;else if(lessons[view]){const d=lessons[view];a.innerHTML=`<section class="page">${title('교과서 본문',d.t,d.s)}<div class="section-title"><div><span class="eyebrow">TEXTBOOK</span><h2>${d.b1t}</h2></div></div><div class="dialogues">${d.b1.map(dialogue).join('')}</div><div class="section-title"><div><span class="eyebrow">TEXTBOOK</span><h2>${d.b2t}</h2></div></div><div class="dialogues">${d.b2.map(dialogue).join('')}</div><div class="section-title"><div><span class="eyebrow">표현 다지기</span><h2>함께 알아둘 표현</h2></div></div><div class="exprgrid">${d.e.map(x=>study(x,'compact')).join('')}</div><div class="panel"><h2>본문 문법·발음 포인트</h2><ol>${d.r.map(x=>`<li>${x}</li>`).join('')}</ol></div></section>`}else if(view==='hanzi')renderHanzi();else if(view==='sent')a.innerHTML=`<section class="page">${title('기말 대비 종작 연습','문장 쓰기 20개','한국어만 보고 먼저 쓴 뒤 정답과 음성을 확인하세요.')}<div class="sentences">${S.map((x,i)=>`<article class="sentence"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${x[2]}</h3><div id="ans${i}" class="answer"><strong>${x[0]}</strong><b>${x[1]}</b></div></div><div class="actions"><button onclick="speak('${x[0]}')">🔊</button><button onclick="document.getElementById('ans${i}').classList.toggle('show')">정답</button></div></article>`).join('')}</div></section>`;else if(view==='quiz')renderQuiz()}
function renderHanzi(){const a=document.getElementById('app'),meta={l2:['2과',11],l3:['3과',15],l4:['4과',12]};a.innerHTML=`<section class="page">${title('학습지 한자 암기','단원별 시험 한자 38개','학습지에 정리된 순서와 내용을 그대로 반영했습니다. 각 카드에서 뜻·한어병음·음성을 모두 확인할 수 있습니다.')}<div class="tabs">${Object.keys(meta).map(k=>`<button class="${hanziLesson===k?'active':''}" onclick="hanziLesson='${k}';renderHanzi()"><strong>${meta[k][0]}</strong><span>${meta[k][1]}개</span></button>`).join('')}</div><div class="studygrid">${H[hanziLesson].map(x=>study(x)).join('')}</div></section>`}
function renderQuiz(){const a=document.getElementById('app');if(qi>=Q.length){a.innerHTML=`<section class="score"><span class="eyebrow">QUIZ COMPLETE</span><h1>${score*10}점</h1><p>${score>=7?'좋습니다. 시험 준비가 잘 되어 있습니다.':'틀린 단원을 한 번 더 복습해 보세요.'}</p><button class="primary" onclick="qi=0;score=0;locked=false;renderQuiz()">다시 시작</button></section>`;return}const q=Q[qi];a.innerHTML=`<section class="page quizwrap">${title('실전 퀴즈','최종 점검',`${qi+1} / ${Q.length} 문제`)}<div class="quizbox"><h2>${q[0]}</h2><div>${q[1].map(x=>`<button class="option" onclick="answer(this,'${x.replaceAll("'","\\'")}')">${x}<span></span></button>`).join('')}</div><button id="next" class="primary hidden" onclick="qi++;locked=false;renderQuiz()">다음 →</button></div></section>`}
function answer(btn,val){if(locked)return;locked=true;const right=Q[qi][2];if(val===right){score++;btn.classList.add('ok')}else btn.classList.add('no');[...document.querySelectorAll('.option')].forEach(b=>{if(b.textContent.trim()===right)b.classList.add('ok')});document.getElementById('next').classList.remove('hidden')}
renderNav();go('home');
</script>
</body></html>
